<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b78f6">
<title>민동의 스터디룸 🌷</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f7f6ff;--card:#fff;--text:#252437;--muted:#8b899b;--line:#eceaf5;
  --primary:#7967e9;--primary2:#9a8cf7;--soft:#eeeaff;--pink:#ffe8ee;
  --green:#dff7eb;--shadow:0 12px 35px rgba(70,58,130,.10);--radius:24px;
}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#f5f3ff 0,#fbfbff 55%,#f7f6ff 100%);color:var(--text)}
button,input,select,textarea{font:inherit} button{border:0;cursor:pointer}
.app{max-width:980px;margin:auto;padding:28px 20px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand h1{margin:0;font-size:30px;letter-spacing:-1.5px}.brand p{margin:5px 0 0;color:var(--muted)}
.iconBtn{width:46px;height:46px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:20px}
.datebar{display:grid;grid-template-columns:48px 72px 1fr 48px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:10px;border-radius:22px;box-shadow:var(--shadow);margin-bottom:18px}
.datebar button{height:42px;border-radius:15px;background:#f2f1f7}.datebar .today{background:var(--soft);color:var(--primary);font-weight:800}.datebar strong{text-align:center;font-size:18px}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.5px}.card h2{font-size:22px;margin:6px 0 18px;letter-spacing:-.7px}
select,input,textarea{width:100%;border:1px solid var(--line);background:#faf9ff;border-radius:15px;padding:13px 14px;outline:none;color:var(--text)}
.timer{font-size:clamp(52px,9vw,82px);font-weight:900;letter-spacing:-3px;text-align:center;margin:22px 0 4px;font-variant-numeric:tabular-nums}
.timerStatus{text-align:center;color:var(--muted);font-size:14px;min-height:22px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.primary{background:var(--primary);color:#fff}.danger{background:#fff0f2;color:#e05b70}.secondary{background:#f1f0f5}.actions button{padding:15px;border-radius:16px;font-weight:800}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;background:#faf9ff;border-radius:18px}.stat b{display:block;font-size:24px;margin-top:5px}.stat span{font-size:12px;color:var(--muted)}
.subjectRow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.subjectRow:last-child{border:0}.bar{height:8px;background:#eeeef5;border-radius:10px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:10px}
.tabs{display:flex;gap:8px;overflow:auto;margin:4px 0 18px}.tab{padding:10px 15px;border-radius:14px;background:#fff;border:1px solid var(--line);white-space:nowrap}.tab.active{background:var(--soft);color:var(--primary);font-weight:800}
.view{display:none}.view.active{display:block}.plannerForm{display:grid;grid-template-columns:1fr 1fr auto;gap:9px}.plannerItem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.plannerItem.done .task{text-decoration:line-through;color:#aaa}.check{width:25px;height:25px;border-radius:9px;background:#f0eff6}.done .check{background:var(--primary);color:#fff}.task{flex:1}.small{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:end;gap:8px;height:190px;padding-top:20px}.barCol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%}.barValue{font-size:10px;color:var(--muted);margin-bottom:5px}.barFill{width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#9c8df7,#7563e7);min-height:3px}.barLabel{font-size:10px;color:var(--muted);margin-top:6px}
.history{display:grid;gap:10px}.historyItem{padding:15px;background:#faf9ff;border-radius:16px;display:flex;justify-content:space-between}.empty{text-align:center;color:var(--muted);padding:30px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:10}.bottomInner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{padding:12px 5px;background:transparent;color:#858293;font-size:12px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--primary);font-weight:800}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#272532;color:#fff;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}
@media(max-width:720px){.app{padding:18px 13px 100px}.grid{grid-template-columns:1fr}.card{padding:19px}.plannerForm{grid-template-columns:1fr 1fr}.plannerForm button{grid-column:1/-1}.datebar{grid-template-columns:42px 60px 1fr 42px}.brand h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><h1>민동의 스터디룸 🌷</h1><p id="subtitle"></p></div><button class="iconBtn" onclick="showToast('공부 기록은 이 기기에 자동 저장돼요 💾')">⚙️</button></header>

<div class="datebar">
<button onclick="changeDate(-1)">‹</button><button class="today" onclick="goToday()">오늘</button>
<strong id="dateTitle"></strong><button onclick="changeDate(1)">›</button>
</div>

<div class="tabs">
<button class="tab active" data-view="home">🏠 홈</button>
<button class="tab" data-view="timer">⏱️ 타이머</button>
<button class="tab" data-view="planner">📝 플래너</button>
<button class="tab" data-view="record">📊 기록</button>
</div>

<section id="home" class="view active">
<div class="grid">
<div class="card">
<div class="eyebrow">TODAY'S FLOW</div><h2>오늘의 공부 현황 ✨</h2>
<div class="summary">
<div class="stat"><span>오늘 공부</span><b id="todayTotal">0분 0초</b></div>
<div class="stat"><span>목표 달성</span><b id="goalRate">0%</b></div>
</div>
<div style="margin-top:16px"><div style="display:flex;justify-content:space-between"><span class="small">오늘 목표</span><span class="small" id="goalText">3시간</span></div><div class="bar"><i id="goalBar" style="width:0%"></i></div></div>
</div>
<div class="card"><div class="eyebrow">QUICK START</div><h2>바로 공부하기</h2>
<select id="quickSubject"></select><button class="primary" style="width:100%;padding:15px;border-radius:16px;margin-top:10px;font-weight:800" onclick="startFromHome()">▶ 공부 시작</button>
</div></div>
<div class="card"><div class="eyebrow">TODAY</div><h2>오늘 과목별 공부시간</h2><div id="todaySubjects"></div></div>
</section>

<section id="timer" class="view">
<div class="card"><div class="eyebrow">FOCUS TIMER</div><h2>지금 공부할 과목</h2>
<select id="timerSubject"></select><div class="timer" id="timerDisplay">00:00:00</div><div class="timerStatus" id="timerStatus">공부를 시작하면 시간이 기록돼요.</div>
<div class="actions"><button class="primary" id="pauseBtn" onclick="togglePause()">▶ 공부 시작</button><button class="secondary" id="finishBtn" onclick="finishStudy()">■ 공부 끝내기</button></div>
<button class="danger" style="width:100%;padding:14px;border-radius:16px;margin-top:10px" onclick="resetCurrentTimer()">현재 타이머 초기화</button>
</div>
<div class="card"><div class="eyebrow">TODAY</div><h2>오늘 누적</h2><div id="timerTodaySubjects"></div></div>
</section>

<section id="planner" class="view">
<div class="card"><div class="eyebrow">MY PLANNER</div><h2>오늘 할 일 📝</h2>
<div class="plannerForm"><input id="taskInput" placeholder="공부할 내용을 적어보세요"><input id="taskTime" type="time"><button class="primary" style="border-radius:15px" onclick="addTask()">추가</button></div>
<div id="taskList" style="margin-top:12px"></div></div>
</section>

<section id="record" class="view">
<div class="card"><div class="eyebrow">STUDY ANALYTICS</div><h2>공부시간 추이 📈</h2>
<div class="tabs" style="margin-bottom:10px"><button class="tab active" id="weekBtn" onclick="renderChart('week')">주별</button><button class="tab" id="monthBtn" onclick="renderChart('month')">월별</button></div>
<div id="chartTitle" class="small"></div><div class="chart" id="chart"></div></div>
<div class="grid"><div class="card"><div class="eyebrow">HISTORY</div><h2>최근 공부 기록</h2><div id="history" class="history"></div></div>
<div class="card"><div class="eyebrow">ALL TIME</div><h2>누적 공부시간</h2><div class="stat"><span>전체</span><b id="allTotal">0시간 0분</b></div><div style="margin-top:10px" class="small">기록은 날짜별로 자동 축적됩니다.</div></div></div>
</section>
</div>
<div class="bottom"><div class="bottomInner">
<button class="nav active" data-view="home"><b>🏠</b>홈</button><button class="nav" data-view="timer"><b>⏱️</b>타이머</button><button class="nav" data-view="planner"><b>📝</b>플래너</button><button class="nav" data-view="record"><b>📊</b>기록</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const subjects=["국어","수학","영어","통합과학","생명과학","화학","물리","사회","한국사","기타"];
const KEY="mindong-study-room-v2";
let db=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"tasks":{}}');
let selectedDate=new Date(); selectedDate.setHours(0,0,0,0);
let timer={running:false,paused:false,start:0,base:0,subject:"수학",interval:null};
function pad(n){return String(n).padStart(2,"0")}
function key(d=selectedDate){return d.toISOString().slice(0,10)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function fmtShort(sec){let m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}분 ${s}초`}
function dayObj(k=key()){db.days[k] ||= {}; db.days[k].subjects ||= {}; return db.days[k]}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function dateLabel(d){return d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}
function updateDate(){document.getElementById("dateTitle").textContent=dateLabel(selectedDate);document.getElementById("subtitle").textContent=dateLabel(selectedDate);renderAll()}
function changeDate(n){selectedDate.setDate(selectedDate.getDate()+n); if(timer.running) finishStudy(true); updateDate()}
function goToday(){selectedDate=new Date();selectedDate.setHours(0,0,0,0);updateDate()}
function populate(){["quickSubject","timerSubject"].forEach(id=>document.getElementById(id).innerHTML=subjects.map(s=>`<option>${s}</option>`).join(""))}
function totalForDay(k=key()){return Object.values((db.days[k]||{}).subjects||{}).reduce((a,b)=>a+b,0)}
function formatTotal(sec){let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return h?`${h}시간 ${m}분`:m?`${m}분 ${s}초`:`${s}초`}
function renderSubjects(id,k=key()){let el=document.getElementById(id), obj=(db.days[k]||{}).subjects||{}, vals=subjects.map(s=>[s,obj[s]||0]).filter(x=>x[1]>0);let max=Math.max(...vals.map(x=>x[1]),1);el.innerHTML=vals.length?vals.map(([s,v])=>`<div class="subjectRow"><div style="flex:1"><b>${s}</b><div class="bar"><i style="width:${v/max*100}%"></i></div></div><strong style="margin-left:12px">${fmtShort(v)}</strong></div>`).join(""):'<div class="empty">아직 기록이 없어요 🌱<br>타이머로 공부를 시작해보세요!</div>'}
function renderHome(){let t=totalForDay(), goal=10800;document.getElementById("todayTotal").textContent=fmtShort(t);let rate=Math.min(100,t/goal*100);document.getElementById("goalRate").textContent=Math.round(rate)+"%";document.getElementById("goalBar").style.width=rate+"%";renderSubjects("todaySubjects")}
function renderTimer(){document.getElementById("timerSubject").value=timer.subject;renderSubjects("timerTodaySubjects")}
function startTimer(){timer.subject=document.getElementById("timerSubject").value;timer.running=true;timer.paused=false;timer.start=Date.now();timer.base=0;timer.interval=setInterval(updateTimer,250);document.getElementById("pauseBtn").textContent="⏸ 일시정지";document.getElementById("finishBtn").textContent="■ 공부 끝내기";document.getElementById("timerStatus").textContent="공부 중 · 시간이 자동으로 기록돼요 💜";updateTimer()}
function updateTimer(){let s=timer.base+(timer.running&&!timer.paused?(Date.now()-timer.start)/1000:0);document.getElementById("timerDisplay").textContent=fmt(s)}
function togglePause(){if(!timer.running){startTimer();return}if(timer.paused){timer.start=Date.now();timer.paused=false;document.getElementById("pauseBtn").textContent="⏸ 일시정지";document.getElementById("timerStatus").textContent="공부 중 · 다시 집중해볼까요? 💪"}else{timer.base+=(Date.now()-timer.start)/1000;timer.paused=true;document.getElementById("pauseBtn").textContent="▶ 다시 시작";document.getElementById("timerStatus").textContent="⏸ 정지됨 · 공부 시간이 기록됐어요"}updateTimer()}
function finishStudy(silent=false){if(!timer.running)return;let elapsed=timer.base+(timer.paused?0:(Date.now()-timer.start)/1000);clearInterval(timer.interval);timer.running=false;timer.paused=false;let d=dayObj();d.subjects[timer.subject]=(d.subjects[timer.subject]||0)+elapsed;save();timer.base=0;document.getElementById("timerDisplay").textContent="00:00:00";document.getElementById("pauseBtn").textContent="▶ 공부 시작";document.getElementById("finishBtn").textContent="✓ 공부 끝냄";document.getElementById("timerStatus").textContent=`공부 끝냄 · ${fmtShort(elapsed)} 기록 완료 🌷`;renderAll();if(!silent)showToast("공부 끝냄! 기록에 저장했어요 🌷")}
function resetCurrentTimer(){if(timer.running){clearInterval(timer.interval);timer.running=false}timer.base=0;timer.paused=false;document.getElementById("timerDisplay").textContent="00:00:00";document.getElementById("pauseBtn").textContent="▶ 공부 시작";document.getElementById("finishBtn").textContent="■ 공부 끝내기";document.getElementById("timerStatus").textContent="타이머가 초기화됐어요."}
function startFromHome(){document.getElementById("timerSubject").value=document.getElementById("quickSubject").value;showView("timer");startTimer()}
function addTask(){let text=document.getElementById("taskInput").value.trim();if(!text)return;let k=key();db.tasks[k] ||= [];db.tasks[k].push({text,time:document.getElementById("taskTime").value,done:false});save();document.getElementById("taskInput").value="";document.getElementById("taskTime").value="";renderTasks()}
function toggleTask(i){db.tasks[key()][i].done=!db.tasks[key()][i].done;save();renderTasks()}
function deleteTask(i){db.tasks[key()].splice(i,1);save();renderTasks()}
function renderTasks(){let arr=db.tasks[key()]||[],el=document.getElementById("taskList");el.innerHTML=arr.length?arr.map((x,i)=>`<div class="plannerItem ${x.done?'done':''}"><button class="check" onclick="toggleTask(${i})">${x.done?'✓':''}</button><div class="task"><b>${x.text}</b>${x.time?`<div class="small">${x.time}</div>`:""}</div><button onclick="deleteTask(${i})">🗑️</button></div>`).join(""):'<div class="empty">오늘의 할 일을 추가해보세요 ✏️</div>'}
function renderChart(mode="week"){let now=new Date(selectedDate),labels=[],vals=[];if(mode==="week"){for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);labels.push(d.toLocaleDateString("ko-KR",{weekday:"short"}));vals.push(totalForDay(d.toISOString().slice(0,10)))}}else{for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);let y=d.getFullYear(),m=d.getMonth();let sum=0;let days=new Date(y,m+1,0).getDate();for(let j=1;j<=days;j++)sum+=totalForDay(`${y}-${pad(m+1)}-${pad(j)}`);labels.push(`${m+1}월`);vals.push(sum)}}let max=Math.max(...vals,1);document.getElementById("chartTitle").textContent=mode==="week"?"최근 7일 공부시간":"최근 6개월 공부시간";document.getElementById("chart").innerHTML=labels.map((l,i)=>`<div class="barCol"><div class="barValue">${Math.round(vals[i]/60)}분</div><div class="barFill" style="height:${Math.max(3,vals[i]/max*130)}px"></div><div class="barLabel">${l}</div></div>`).join("");document.getElementById("weekBtn").classList.toggle("active",mode==="week");document.getElementById("monthBtn").classList.toggle("active",mode==="month")}
function renderHistory(){let entries=Object.entries(db.days).map(([k,v])=>[k,totalForDay(k)]).filter(x=>x[1]>0).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);document.getElementById("history").innerHTML=entries.length?entries.map(([k,v])=>`<div class="historyItem"><span>${new Date(k+"T00:00:00").toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"})}</span><b>${formatTotal(v)}</b></div>`).join(""):'<div class="empty">아직 공부 기록이 없어요.</div>';document.getElementById("allTotal").textContent=formatTotal(Object.keys(db.days).reduce((a,k)=>a+totalForDay(k),0))}
function renderAll(){renderHome();renderTimer();renderTasks();renderHistory();renderChart("week")}
function showView(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===v));if(v==="record")renderChart("week")}
document.querySelectorAll("[data-view]").forEach(x=>x.addEventListener("click",()=>showView(x.dataset.view)));
function showToast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
populate();updateDate();setInterval(()=>{if(timer.running&&!timer.paused)updateTimer()},1000);
</script>
</body>
</html>
